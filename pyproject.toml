[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insight-reporter"
version = "0.1.0"
description = "A local-first, evidence-grounded AI data insight reporter."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "Flask>=3.1,<4",
    "ollama>=0.6.2,<0.7",
    "openpyxl>=3.1.5,<4",
    "matplotlib>=3.11,<4",
    "reportlab>=4.4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insight_reporter = ["templates/*.html", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
