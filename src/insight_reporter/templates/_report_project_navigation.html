<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<nav class="report-project-nav" aria-label="Current workspace navigation">
  <a class="report-project-brand" href="{{ url_for('core.workspace_history') }}">Insight Reporter</a>
  <div class="report-project-links">
    <a href="{{ url_for('core.workspace_detail', dataset_id=dataset_id) }}"
      {% if current_section == "source" %}aria-current="page"{% endif %}>Workspace</a>
    <a href="{{ url_for('core.dataset_profile', dataset_id=dataset_id) }}"
      {% if current_section == "kpi" %}aria-current="page"{% endif %}>KPI setup</a>
    <a href="{{ url_for('core.saved_visualizations', dataset_id=dataset_id) }}"
      {% if current_section == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="{{ url_for('core.generated_report_history', dataset_id=dataset_id) }}"
      {% if current_section in ("next", "history") %}aria-current="page"{% endif %}>Reports</a>
  </div>
</nav>
