<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Excel Worksheet | AI Insight Reporter</title>
  </head>
  <body>
    <main>
      <h1>Select an Excel worksheet</h1>
      <p>
        Choose the one worksheet that contains the tabular dataset. Hidden worksheets are not
        available, and the selected sheet is validated before profiling.
      </p>
      {% if error %}
        <p role="alert"><strong>Worksheet rejected:</strong> {{ error }}</p>
      {% endif %}
      <form method="post"
        action="{{ url_for('core.select_excel_sheet', dataset_id=dataset_id) }}">
        <label for="table-name">Worksheet</label>
        <select id="table-name" name="table_name" required>
          <option value="">Select a worksheet</option>
          {% for table_name in table_names %}
            <option value="{{ table_name }}">{{ table_name }}</option>
          {% endfor %}
        </select>
        <button type="submit">Validate and profile worksheet</button>
      </form>
      <p>
        <a href="{{ url_for(
          'core.workspace_detail',
          dataset_id=dataset_id
        ) }}">Return to workspace</a>
      </p>
    </main>
  </body>
</html>
