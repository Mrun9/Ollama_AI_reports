<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Source | {{ workspace.record.name }}</title>
  </head>
  <body>
    <main>
      <p>
        <a href="{{ url_for(
          'core.workspace_detail',
          dataset_id=workspace.record.dataset_id
        ) }}">Return to workspace</a>
      </p>
      <h1>Select source file</h1>
      <p>
        Add one CSV, flat JSON, or XLSX source to
        <strong>{{ workspace.record.name }}</strong>.
      </p>
      <form method="post" enctype="multipart/form-data" action="{{ url_for(
        'core.add_workspace_source',
        dataset_id=workspace.record.dataset_id
      ) }}">
        <label>
          Dataset file
          <input name="file" type="file"
            accept=".csv,.json,.xlsx,text/csv,application/json" required>
        </label>
        <button type="submit">Validate and add source</button>
      </form>
      <ul>
        <li>Maximum file size: {{ max_bytes }} bytes</li>
        <li>Maximum rows: {{ max_rows }}</li>
        <li>Maximum columns: {{ max_columns }}</li>
      </ul>
    </main>
  </body>
</html>
